services:
  pinsearch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinsearch-multimodal
    ports:
      - "8000:8000"
    volumes:
      - ./imagenes:/app/imagenes
      - ./anotaciones:/app/anotaciones
      - ./data:/app/data
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/data/hf_cache
    restart: unless-stopped
