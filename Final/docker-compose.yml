name: pinsearch-vit-b16

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: pinsearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinsearch_dev}
      POSTGRES_DB: pinsearch_vitb16
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinsearch -d pinsearch_vitb16"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pinsearch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinsearch-vit-b16
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - ./imagenes:/app/imagenes
      - ./anotaciones:/app/anotaciones
      - ./data:/app/data
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/data/hf_cache
      - DATABASE_URL=postgresql://pinsearch:${POSTGRES_PASSWORD:-pinsearch_dev}@db:5432/pinsearch_vitb16
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
